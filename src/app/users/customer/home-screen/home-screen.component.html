<!--Modais-->
<app-modal-buy-miles (milesUpdated)="onMilesUpdated()"></app-modal-buy-miles>
<app-modal-cancel-reserve [selectedBooking]="selectedBooking"></app-modal-cancel-reserve>
<!--Navbar-->
<app-navbar-customer></app-navbar-customer>
<!--Template principal da tela-->
<div class="d-flex align-items-center justify-content-center vh-100 bg-orange flex-column">
    <div class="w-100 h-90 padding-2">
        <div class="bg-white w-100 h-100 rounded-3">
            <div class="w-100 h-10">
                <div class="d-flex justify-content-between align-items-center h-100 px-3">
                    <div>
                        <h3 class="m-0">Olá! <span class="text-orange m-0">{{ customerName }}</span></h3>
                    </div>
                    <div class="d-flex flex-column align-items-center mt-3">
                        <div>
                            <h4 class="m-0">Saldo de Milhas: <span class="text-orange m-0">{{ milesBalance }}</span></h4>
                            <!--Acionar modal buy miles-->
                        <div style="display: flex; justify-content: center;">
                            <a href="#" class="btn btn-orange text-white h-25 px-3" data-bs-toggle="modal" data-bs-target="#buyMilesModal">Comprar Milhas</a>
                        </div>
                    </div>    
                </div>
            </div>

            <div class="w-100 h-90 px-3">
                <h3 class="m-0">Suas Viagens:</h3>
                <div class="rounded border border-dark">
                    <table class="table table-hover table-bordered m-0 border-dark">
                        <thead class="align-middle text-center">
                            <tr>
                                <th class="text-white bg-orange-darker">Data/Hora</th>                                
                                <th class="text-white bg-orange-darker">Origem</th>
                                <th class="text-white bg-orange-darker">Destino</th>
                                <th class="text-white bg-orange-darker">Ações</th>                                
                                <th class="text-white bg-orange-darker">Status</th>
                            </tr>
                        </thead>
                        <tbody class="align-middle text-center">
                            <tr *ngFor="let booking of listBooking" [hidden]="booking.status !== 'RESERVADA'" >
                                <td>{{booking.timeBooking| date: 'dd/MM/yyyy HH:mm' }}</td>
                                <td>{{booking.flightDetails?.aeroportoOrigem}}</td>
                                <td>{{booking.flightDetails?.aeroportoDestino}}</td>

                                <td>
                                    <!-- <span class="text-primary fw-medium" [routerLink]="['/view-booking']">Visualizar</span> -->
                                    <!-- <br> -->
                                    <!--Acionar modal cancel reserve-->
                                    <span *ngIf="booking.status !== 'CANCELADA'" class="text-danger fw-medium" 
                                    data-bs-toggle="modal" 
                                    data-bs-target="#cancelReserveModal"                                    
                                    (click)="setSelectedBooking(booking)">
                                    Cancelar</span>
                                </td>
                                <td [ngClass]="getStatusClass(booking.status)">{{ booking.status }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
