<app-reusable-modal modalId="checkInModal" title="Realizar Check-in">
    <p>
        Ao clicar em Check-in você confirma que tem ciência da data e horário do seu voo.
    </p>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="submitCheckInBooking()">Confirmar</button>
    </div>
</app-reusable-modal>
